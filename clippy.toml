allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
avoid-breaking-exported-api = false
doc-valid-idents = ["YubiKey", ".."]
disallowed-types = [
  { path = "tk::errors::ErrorCode", reason = "assign ErrorCode only in crate::errors::classify and the output layer" },
]
disallowed-macros = [
  { path = "tracing::trace_span", reason = "prefer #[instrument] over manually built spans" },
  { path = "tracing::debug_span", reason = "prefer #[instrument] over manually built spans" },
  { path = "tracing::info_span", reason = "prefer #[instrument] over manually built spans" },
  { path = "tracing::warn_span", reason = "prefer #[instrument] over manually built spans" },
  { path = "tracing::error_span", reason = "prefer #[instrument] over manually built spans" },
]
