name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tag to name the manifest version and sit on main
        shell: bash
        run: |
          set -euo pipefail
          manifest_version=$(cargo metadata --locked --format-version 1 \
            | jq -r '.packages[] | select(.name == "turnkey_tk") | .version')
          if [ "$GITHUB_REF_NAME" != "v$manifest_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the turnkey_tk manifest version $manifest_version" >&2
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tagged commit $GITHUB_SHA is not on main" >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      ARCHIVE: tk-${{ matrix.target }}-${{ github.ref_name }}.tar.gz
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the musl C toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          echo "CC=musl-gcc" >> "$GITHUB_ENV"
      - name: Build release binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup target add "$TARGET"
          cargo build --locked --release --bin tk --target "$TARGET"
      - name: Package archive and checksum
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          package="${ARCHIVE%.tar.gz}"
          mkdir "$package"
          cp "target/$TARGET/release/tk" README.md "$package/"
          tar -czf "$ARCHIVE" "$package"
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: provenance
        with:
          subject-path: ${{ env.ARCHIVE }}
      - name: Package provenance bundle
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE" "$ARCHIVE.sigstore.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
            ${{ env.ARCHIVE }}.sigstore.json
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Verify every archive against its checksum and provenance
        shell: bash
        env:
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          cd dist
          for archive in *.tar.gz; do
            shasum -a 256 --check "$archive.sha256"
            sh ../.github/scripts/verify-release-provenance.sh "$archive" "$archive.sigstore.json" "$IDENTITY"
          done
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.sigstore.json
          fail_on_unmatched_files: true
      - name: Verify installation and update from the published release
        env:
          TK_VERSION: ${{ github.ref_name }}
          TK_INSTALL_DIR: ${{ runner.temp }}/tk-release-test
        run: |
          set -euo pipefail
          sh install.sh
          "$TK_INSTALL_DIR/tk" --message-format json update --tag "$TK_VERSION" > update.json
          jq -e --arg tag "$TK_VERSION" --arg path "$TK_INSTALL_DIR/tk" \
            '.reason == "updated" and .to == $tag and .path == $path' update.json
          test "$("$TK_INSTALL_DIR/tk" --version)" = "tk ${TK_VERSION#v}"
          test "$(find "$TK_INSTALL_DIR" -type f | wc -l)" -eq 1
