name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tag to name the manifest version and sit on main
        shell: bash
        run: |
          set -euo pipefail
          manifest_version=$(cargo metadata --locked --format-version 1 \
            | jq -r '.packages[] | select(.name == "turnkey_tk") | .version')
          if [ "$GITHUB_REF_NAME" != "v$manifest_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the turnkey_tk manifest version $manifest_version" >&2
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tagged commit $GITHUB_SHA is not on main" >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the musl C toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          echo "CC=musl-gcc" >> "$GITHUB_ENV"
      - name: Build release binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup target add "$TARGET"
          cargo build --locked --release --bin tk --target "$TARGET"
      - name: Package archive and checksum
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          package="tk-${TARGET}-${GITHUB_REF_NAME}"
          mkdir "$package"
          cp "target/$TARGET/release/tk" README.md "$package/"
          tar -czf "$package.tar.gz" "$package"
          shasum -a 256 "$package.tar.gz" > "$package.tar.gz.sha256"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: provenance
        with:
          subject-path: tk-${{ matrix.target }}-${{ github.ref_name }}.tar.gz
      - name: Package provenance bundle
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          ARCHIVE: tk-${{ matrix.target }}-${{ github.ref_name }}.tar.gz
        run: cp "$BUNDLE" "$ARCHIVE.sigstore.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: |
            tk-${{ matrix.target }}-${{ github.ref_name }}.tar.gz
            tk-${{ matrix.target }}-${{ github.ref_name }}.tar.gz.sha256
            tk-${{ matrix.target }}-${{ github.ref_name }}.tar.gz.sigstore.json
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Verify every archive against its checksum
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          for archive in *.tar.gz; do
            shasum -a 256 --check "$archive.sha256"
          done
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.sigstore.json
          fail_on_unmatched_files: true
