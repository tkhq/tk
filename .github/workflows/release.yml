name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tag to name the manifest version and sit on main
        shell: bash
        run: |
          set -euo pipefail
          manifest_version=$(cargo metadata --locked --format-version 1 \
            | jq -r '.packages[] | select(.name == "turnkey_tk") | .version')
          if [ "$GITHUB_REF_NAME" != "v$manifest_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the turnkey_tk manifest version $manifest_version" >&2
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tagged commit $GITHUB_SHA is not on main" >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the musl C toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          echo "CC=musl-gcc" >> "$GITHUB_ENV"
      - name: Build release binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup target add "$TARGET"
          cargo build --locked --release --bin tk --target "$TARGET"
      - name: Package archive and checksum
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          package="tk-${TARGET}-${GITHUB_REF_NAME}"
          mkdir "$package"
          cp "target/$TARGET/release/tk" README.md "$package/"
          tar -czf "$package.tar.gz" "$package"
          shasum -a 256 "$package.tar.gz" > "$package.tar.gz.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: |
            tk-${{ matrix.target }}-${{ github.ref_name }}.tar.gz
            tk-${{ matrix.target }}-${{ github.ref_name }}.tar.gz.sha256
          if-no-files-found: error

  sign:
    name: Sign release archives
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Install rsign2
        run: cargo install rsign2 --locked --version 0.6.7
      - name: Sign every archive with a key generated for this run
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/minisign.key"
          trap 'rm -f "$key"' EXIT
          rsign generate -f -W -p dist/minisign.pub -s "$key"
          echo "::add-mask::$(tail -n 1 "$key")"
          cd dist
          for archive in *.tar.gz; do
            rsign sign -W -s "$key" -x "$archive.sig" "$archive"
          done
      - name: Verify every archive against its checksum and signature
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          pubkey=$(tail -n 1 minisign.pub)
          for archive in *.tar.gz; do
            test -s "$archive.sha256"
            test -s "$archive.sig"
            shasum -a 256 --check "$archive.sha256"
            rsign verify "$archive" -P "$pubkey" -x "$archive.sig"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-release
          path: dist
          if-no-files-found: error

  publish:
    name: Publish to crates.io
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-release
          path: ${{ runner.temp }}/signed-release
      - name: Pin this release's signing key in the published manifest
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '\n[package.metadata.binstall.signing]\n'
            printf 'algorithm = "minisign"\n'
            printf 'pubkey = "%s"\n' "$(tail -n 1 "$RUNNER_TEMP/signed-release/minisign.pub")"
          } >> Cargo.toml
      - name: Publish turnkey_tk
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --allow-dirty

  release:
    name: Publish GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-release
          path: dist
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.sig
            dist/minisign.pub
          fail_on_unmatched_files: true
