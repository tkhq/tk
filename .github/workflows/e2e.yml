name: e2e

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - src/**
      - tests/**
      - build.rs
      - skills/**
      - docs/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/e2e.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-turnkey-org
  cancel-in-progress: false

jobs:
  e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TK_E2E_ORGANIZATION_ID: ${{ secrets.TK_E2E_ORGANIZATION_ID }}
      TK_E2E_API_PUBLIC_KEY: ${{ secrets.TK_E2E_API_PUBLIC_KEY }}
      TK_E2E_API_PRIVATE_KEY: ${{ secrets.TK_E2E_API_PRIVATE_KEY }}
      TK_E2E_API_BASE_URL: ${{ secrets.TK_E2E_API_BASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install SSH, GnuPG, and git
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-server openssh-client gnupg git
          sudo mkdir -p /run/sshd
      - name: Run end-to-end tests
        run: cargo test --locked --test e2e -- --ignored --test-threads 4
