name: prerelease
# Publishes a GitHub prerelease for every pull request push, tagged
# pr-<number>-<short sha>, with the same archives the release workflow ships.
# Install one with: TK_VERSION=pr-44-abc1234 sh install.sh
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prerelease-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build ${{ matrix.target }}
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Name the prerelease tag
        id: tag
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          short=${HEAD_SHA:0:7}
          if [ -n "$PR_NUMBER" ]; then
            echo "tag=pr-${PR_NUMBER}-${short}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev-${short}" >> "$GITHUB_OUTPUT"
          fi
      - name: Install the musl C toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          echo "CC=musl-gcc" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build release binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup target add "$TARGET"
          cargo build --locked --release --bin tk --target "$TARGET"
      - name: Package archive and checksum
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          package="tk-${TARGET}-${TAG}"
          mkdir "$package"
          cp "target/$TARGET/release/tk" README.md "$package/"
          tar -czf "$package.tar.gz" "$package"
          shasum -a 256 "$package.tar.gz" > "$package.tar.gz.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: |
            tk-${{ matrix.target }}-${{ steps.tag.outputs.tag }}.tar.gz
            tk-${{ matrix.target }}-${{ steps.tag.outputs.tag }}.tar.gz.sha256
          if-no-files-found: error
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
  publish:
    name: Publish prerelease
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Verify every archive against its checksum
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          for archive in *.tar.gz; do
            shasum -a 256 --check "$archive.sha256"
          done
      - name: Remove older prereleases of this pull request
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          gh release list --limit 200 --json tagName,isPrerelease \
            --jq ".[] | select(.isPrerelease and (.tagName | startswith(\"pr-${PR_NUMBER}-\")) and .tagName != \"${TAG}\") | .tagName" \
            | while read -r old; do
                gh release delete "$old" --cleanup-tag --yes
              done
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ needs.build.outputs.tag }}
          tag_name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ github.event.pull_request.head.sha || github.sha }}
          prerelease: true
          body: |
            Automated build of ${{ github.event.pull_request.html_url || github.ref }} at ${{ github.event.pull_request.head.sha || github.sha }}.
            Install with `TK_VERSION=${{ needs.build.outputs.tag }} sh install.sh`.
          files: |
            dist/*.tar.gz
            dist/*.sha256
          fail_on_unmatched_files: true
