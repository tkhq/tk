[workspace]

[package]
name = "turnkey_tk"
version = "0.5.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"
description = "A CLI for machines to use Turnkey for git, ssh, and credential management"
repository = "https://github.com/tkhq/tk"
homepage = "https://www.turnkey.com/agent-auth-beta"
keywords = ["turnkey", "cli", "ssh", "git", "signing"]
categories = ["command-line-utilities", "cryptography", "authentication"]
readme = "README.md"
include = [
    "build.rs",
    "docs/*.md",
    "skills/**/*.md",
    "src/**/*.rs",
    "LICENSE",
    "README.md",
]

[[bin]]
name = "tk"
path = "src/main.rs"

[lints.rust]
missing_docs = "deny"
# Coding style
unused_qualifications = "deny"
redundant_imports = "deny"
unused_lifetimes = "deny"
trivial_numeric_casts = "deny"

[lints.clippy]
# Scaffolding
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
exit = "deny"
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
unwrap_in_result = "deny"
doc_markdown = "deny"
# Coding style
cloned_instead_of_copied = "deny"
implicit_clone = "deny"
redundant_closure_for_method_calls = "deny"
trivially_copy_pass_by_ref = "deny"
unused_async = "deny"
unused_self = "deny"
disallowed_macros = "deny"
# Types and data flow
match_wildcard_for_single_variants = "deny"
struct_excessive_bools = "deny"
fn_params_excessive_bools = "deny"
option_option = "deny"
ref_option = "deny"
rest_pat_in_fully_bound_structs = "deny"
unnecessary_wraps = "deny"
partial_pub_fields = "deny"
# I/O and errors
fallible_impl_from = "deny"
map_err_ignore = "deny"
disallowed_types = "deny"
# Tests
assertions_on_result_states = "deny"
manual_assert = "deny"

[dependencies]
anstyle = { version = "1.0.14", default-features = false }
anyhow = { version = "1.0.104", default-features = false }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
clap = { version = "4.6.6", features = ["std", "derive", "help", "usage", "error-context", "env"], default-features = false }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
hex = { version = "0.4.3", default-features = false, features = ["std"] }
libc = { version = "0.2.189", default-features = false }
rand_core = { version = "0.6.4", default-features = false, features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
rpassword = { version = "7.4", default-features = false }
semver = { version = "1.0.28", default-features = false, features = ["std"] }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
sha1 = { version = "0.10", default-features = false }
sha2 = { version = "0.11.0", default-features = false }
signature = { version = "2.2", default-features = false }
socket2 = { version = "0.6.5", default-features = false }
ssh-key = { version = "0.6.7", default-features = false, features = ["ed25519", "p256", "p384", "p521", "rsa", "std"] }
tar = { version = "0.4.46", default-features = false }
thiserror = { version = "2.0.20", default-features = false }
tokio = { version = "=1.53.1", default-features = false, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
toml = { version = "1.1.5", default-features = false, features = ["serde", "parse", "display"] }
tracing = { version = "0.1.44", default-features = false, features = ["attributes", "std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "env-filter", "fmt"] }
turnkey_api_key_stamper = "0.16.0"
turnkey_client = "0.16.0"
turnkey_enclave_encrypt = "0.16.0"
uuid = { version = "1", default-features = false, features = ["serde", "std", "v4"] }
zeroize = { version = "1.8", default-features = false, features = ["alloc", "serde"] }

[build-dependencies]
sha2 = { version = "0.11.0", default-features = false }

[dev-dependencies]
assert_cmd = { version = "2.2.2", default-features = false }
predicates = { version = "3.1.4", default-features = false }
ssh-key = { version = "0.6.7", default-features = false, features = ["rand_core"] }
strum = { version = "0.28.0", default-features = false, features = ["derive", "std", "strum_macros"] }
tempfile = { version = "3.27.0", default-features = false }
tokio = { version = "=1.53.1", default-features = false, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
wiremock = { version = "0.6.5", default-features = false }
